name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify gofmt
        run: |
          fmt_out="$(gofmt -l .)"

          if [ -n "$fmt_out" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=3m

  vulncheck:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: go test -race -short -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        run: |
          # Exclude packages that aren't meant to carry unit-test coverage:
          # generated mocks, cmd/ (a handful of wiring lines), and
          # internal/bootstrap (DI plumbing exercised by the integration
          # suite, not unit tests). Including them in the denominator made
          # the percentage meaningless rather than a real signal.
          grep -v -E "/mocks/|url-shortener/cmd/|/internal/bootstrap/" coverage.out > coverage.filtered.out
          total=$(go tool cover -func=coverage.filtered.out | tail -n1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage (filtered): ${total}%"
          echo "COVERAGE=${total}" >> "$GITHUB_ENV"
          # Starting floor deliberately conservative — this is a
          # regression tripwire, not a target. Once you've confirmed the
          # actual number locally (`go tool cover -func=coverage.out`),
          # raise this to just below it and ratchet up over time.
          awk -v cov="$total" 'BEGIN { if (cov < 30) { print "coverage below 30% floor"; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Build application
        run: go build ./...

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify Docker
        run: docker info

      - name: Run integration tests
        run: go test -tags=integration -race -v ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
