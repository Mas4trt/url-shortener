run:
  timeout: 3m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - unused
    - ineffassign
    - bodyclose
    - unconvert
    - misspell
    - unparam    # catches unused function parameters/returns — cheap to fix, easy to miss in review
    - prealloc   # flags slices that could be preallocated, relevant given hot paths like alias generation
    - gocritic   # broad diagnostics (e.g. wrong sprintf verbs, redundant nil checks)

linters-settings:
  errcheck:
    exclude-functions:
      - (*database/sql.Rows).Close

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
