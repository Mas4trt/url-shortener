services:
  urlshortener-postgres:
    image: postgres:18.4-bookworm
    container_name: urlshortener-env-postgress
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../out/pqdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  app:
    build: 
      context: .
      dockerfile: ./Dockerfile
    container_name: urlshortener-app
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@urlshortener-postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=urlshortener-redis:6379
      - CONFIG_PATH=/root/config/local.yaml
      - RUN_MIGRATIONS=false # Если миграции делает отдельный сервис-контейнер
    depends_on:
      urlshortener-postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "8080:8080"
  
  urlshortener-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations/", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@urlshortener-postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      urlshortener-postgres:
        condition: service_healthy
  
  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: urlshortener-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:urlshortener-postgres:5432
    ports:
      - "127.0.0.1:5433:5432"
  
  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    ports:
      - "6379:6379"
    restart: always
  