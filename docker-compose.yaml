services:
  urlshortener-postgres:
    image: postgres:18.4-bookworm
    container_name: urlshortener-env-postgress
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../out/pqdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  urlshortener-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../migrations:/migrations
    depends_on:
      urlshortener-postgres:
        condition: service_healthy
  
  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: urlshortener-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:urlshortener-postgres:5432
    ports:
      - "127.0.0.1:5433:5432"
  
  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    ports:
      - "6379:6379"
    restart: always
  